<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Made with love by RAJDIP DHAR">
  <defs>
    <linearGradient id="fsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/><stop offset=".6" stop-color="#2a1b5e"/><stop offset="1" stop-color="#ff7e5f"/>
    </linearGradient>
    <linearGradient id="ftext" x1="0" x2="1">
      <stop offset="0" stop-color="#7dd3fc"><animate attributeName="stop-color" values="#7dd3fc;#f472b6;#fcd34d;#7dd3fc" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#fcd34d"><animate attributeName="stop-color" values="#fcd34d;#7dd3fc;#f472b6;#fcd34d" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="fglow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="fsun"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#fsky)"/>
  <g fill="#fff">
    <circle cx="80" cy="40" r="1.5"><animate attributeName="opacity" values="1;.1;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="90" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="30" r="1.7"><animate attributeName="opacity" values="1;.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="70" r="1.3"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="35" r="1.6"><animate attributeName="opacity" values="1;.1;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="85" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="45" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="100" r="1.3"><animate attributeName="opacity" values=".3;1;.3" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>
  <!-- shooting star -->
  <g stroke-linecap="round">
    <line x1="0" y1="0" x2="-70" y2="-24" stroke="#fff" stroke-width="2" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="900 20;300 170" dur="6s" repeatCount="indefinite" keyTimes="0;1"/>
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.6;.75;1" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- rising sun behind the waves -->
  <circle cx="600" cy="250" r="90" fill="url(#fsun)"><animate attributeName="cy" values="270;225;270" dur="10s" repeatCount="indefinite"/></circle>
  <!-- text -->
  <text x="600" y="108" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" letter-spacing="8" fill="#c7d2fe">— CRAFTED UNDER EVERY KIND OF SKY —</text>
  <text x="600" y="168" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" letter-spacing="3" fill="url(#ftext)" filter="url(#fglow)">MADE WITH
    <tspan fill="#f43f5e">♥<animate attributeName="font-size" values="40;50;40;46;40" dur="1.6s" repeatCount="indefinite"/></tspan>
    BY RAJDIP DHAR</text>
  <text x="600" y="206" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" letter-spacing="6" fill="#fde68a">A RAJDIP DHAR PROJECT  ·  MERIDIAN</text>
  <!-- waves -->
  <path fill="#1e1b4b" fill-opacity=".55" d="M0 260 Q 150 230 300 260 T 600 260 T 900 260 T 1200 260 V320 H0Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0 260 Q 150 230 300 260 T 600 260 T 900 260 T 1200 260 V320 H0Z;M0 260 Q 150 290 300 260 T 600 260 T 900 260 T 1200 260 V320 H0Z;M0 260 Q 150 230 300 260 T 600 260 T 900 260 T 1200 260 V320 H0Z"/></path>
  <path fill="#0f172a" fill-opacity=".8" d="M0 285 Q 150 265 300 285 T 600 285 T 900 285 T 1200 285 V320 H0Z">
    <animate attributeName="d" dur="5s" repeatCount="indefinite" values="M0 285 Q 150 305 300 285 T 600 285 T 900 285 T 1200 285 V320 H0Z;M0 285 Q 150 265 300 285 T 600 285 T 900 285 T 1200 285 V320 H0Z;M0 285 Q 150 305 300 285 T 600 285 T 900 285 T 1200 285 V320 H0Z"/></path>
</svg>
