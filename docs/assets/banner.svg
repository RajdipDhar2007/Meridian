<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Meridian - Instrument-Panel Weather App">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"><animate attributeName="stop-color" values="#0b1026;#1b2a6b;#0b1026" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#3a1c71"><animate attributeName="stop-color" values="#3a1c71;#ff7e5f;#3a1c71" dur="12s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff7ae"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="90" cy="60" r="1.6"><animate attributeName="opacity" values="1;.1;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="130" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="40" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="70" r="1.4"><animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="38" r="1.7"><animate attributeName="opacity" values="1;.1;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="140" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(600 400)">
    <circle r="330" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-dasharray="4 8"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-70;70;-70" dur="20s" repeatCount="indefinite"/>
      <g transform="translate(0 -330)"><circle r="70" fill="url(#sun)"/><circle r="22" fill="#fde68a" filter="url(#glow)"/></g>
    </g>
  </g>
  <g filter="url(#blur)" fill="#e2e8f0" opacity=".55">
    <g><animateTransform attributeName="transform" type="translate" from="-300 0" to="1300 0" dur="38s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="110" rx="90" ry="26"/><ellipse cx="-40" cy="95" rx="50" ry="26"/><ellipse cx="40" cy="92" rx="56" ry="30"/></g>
    <g><animateTransform attributeName="transform" type="translate" from="-700 0" to="900 0" dur="52s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="300" rx="110" ry="28"/><ellipse cx="-50" cy="285" rx="60" ry="28"/><ellipse cx="50" cy="282" rx="66" ry="32"/></g>
  </g>
  <g stroke="#bae6fd" stroke-width="1.4" stroke-linecap="round" opacity=".55">
    <line x1="150" y1="-20" x2="140" y2="0"><animateTransform attributeName="transform" type="translate" from="0 0" to="-40 450" dur="1.1s" repeatCount="indefinite"/></line>
    <line x1="330" y1="-20" x2="320" y2="0"><animateTransform attributeName="transform" type="translate" from="0 0" to="-40 450" dur="1.4s" begin=".3s" repeatCount="indefinite"/></line>
    <line x1="910" y1="-20" x2="900" y2="0"><animateTransform attributeName="transform" type="translate" from="0 0" to="-40 450" dur="1.2s" begin=".6s" repeatCount="indefinite"/></line>
    <line x1="1060" y1="-20" x2="1050" y2="0"><animateTransform attributeName="transform" type="translate" from="0 0" to="-40 450" dur="1s" begin=".1s" repeatCount="indefinite"/></line>
    <line x1="1130" y1="-20" x2="1120" y2="0"><animateTransform attributeName="transform" type="translate" from="0 0" to="-40 450" dur="1.3s" begin=".8s" repeatCount="indefinite"/></line>
  </g>
  <text x="600" y="200" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="96" font-weight="800" letter-spacing="18" fill="url(#title)" filter="url(#glow)">MERIDIAN<animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/></text>
  <text x="600" y="250" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" letter-spacing="7" fill="#e0e7ff">INSTRUMENT-PANEL WEATHER APP</text>
  <text x="600" y="292" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" letter-spacing="3" fill="#fcd34d">A  RAJDIP DHAR  PROJECT</text>
</svg>
